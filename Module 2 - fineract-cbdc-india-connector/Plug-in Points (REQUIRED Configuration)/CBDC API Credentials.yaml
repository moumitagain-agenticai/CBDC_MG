# configs/config.yaml
cbdc:
  base_url: "YOUR_CBDC_API_ENDPOINT"  # RBI CBDC Pilot API URL
  api_key: "${CBDC_API_KEY}"  # Your API key
  api_secret: "${CBDC_API_SECRET}"  # Your API secret
  sponsor_bank_id: "YOUR_SPONSOR_BANK_ID"  # Sponsor bank ID
  merchant_id: "YOUR_MERCHANT_ID"  # Merchant ID
  terminal_id: "YOUR_TERMINAL_ID"  # Terminal ID